name: go-binaries

# 编译验证（滚动更新，无版本化 Release）：
#   - PR / push main / 手动触发 → 测试 + 五平台编译验证，产物仅存 artifact（不发布）
# 正式发布为 nightly 构建（见 nightly.yml）。本工作流不做 tag 触发的 GitHub Release，
# 也不做 tag↔版本一致性断言——本项目无版本号，构建标识在编译期注入。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # 编译期注入的构建标识（滚动更新，无版本号）。main 包经 -X main.appVersion 注入。
  APP_VERSION_PKG: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # 面板前端产物 internal/panel/dist 已提交进仓库，panel 包的静态资源测试无需 node。
      - run: go test ./...
      # 已知漏洞扫描：只扫当前模块依赖，发现问题即失败（issue #65）。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 计算构建标识
        id: ver
        run: echo "v=nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 构建（注入构建标识）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BIN="wokbuddy-demon${{ matrix.goos == 'windows' && '.exe' || '' }}"
          go build -trimpath \
            -ldflags "-s -w -X ${APP_VERSION_PKG}.appVersion=${{ steps.ver.outputs.v }}" \
            -o "$BIN" ./cmd/server

      # 断言：二进制必须含注入的构建标识（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言构建标识
        run: |
          BIN="wokbuddy-demon${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing build id ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "build id assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          case "${{ matrix.goos }}" in
            windows)
              NAME="wokbuddy-demon-${V}-windows-amd64.zip"
              zip -q "$NAME" wokbuddy-demon.exe config.example.json README.md
              ;;
            *)
              NAME="wokbuddy-demon-${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wokbuddy-demon config.example.json README.md
              ;;
          esac
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.name }}
          path: |
            ${{ env.name }}
            ${{ env.name }}.sha256
          retention-days: 7
