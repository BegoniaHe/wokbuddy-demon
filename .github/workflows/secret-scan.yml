name: Secret Scan

# 检测误提交的密钥 / 凭证。本仓库凭证与状态（auths/、data/、config.json）已被
# gitignore，此工作流是最后一道防线。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: Block committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.3
        with:
          extra_args: --results=verified --fail-on-scan-errors
