version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - dupword
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
    govet:
      # enable-all 包含 shadow（变量遮蔽）与 nilness 等 Go 官方分析器。
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - performance
        - style
      disabled-checks:
        - ifElseChain
        # 项目既有 API 一致返回多值、匿名返回；重命名会波及大量调用点，
        # 属风格取舍而非缺陷。
        - tooManyResultsChecker
        - unnamedResult
        - importShadow
    gosec:
      excludes:
        - G104
        # 非加密随机：账号池加权选号 / 会话 id 抖动，非安全用途。
        - G404
        # 路径拼接 / SSRF：仅出现在本地 CLI 工具与 login.sh 驱动的 OAuth 流程，
        # 输入来自本机用户，非对外服务的攻击面。
        - G703
        - G704
        # 序列化 api_key 到本地 config：config 本就是凭据载体，落盘为设计行为。
        - G117
    misspell:
      locale: US
    exhaustive:
      # 带 default 兜底的 switch 视为已穷举（项目大量 switch 用 default 收口）。
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    # godot：仅要求声明注释以句号收尾（接受中文句号「。」），不约束行内注释。
    godot:
      scope: declarations
    # lll：源码行宽上限 140（测试内的长 JSON 字面量另行豁免，见 exclusions）。
    lll:
      line-length: 140
    # dupl：150 token 的重复片段视为可提取（当前无命中，作为回归护栏）。
    dupl:
      threshold: 150
    # cyclop / gocognit / nestif：函数复杂度上限。三者同口径收紧，
    # 用于抑制超长热路径（如 SSE 聚合、请求转发）继续膨胀。
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 5
    # interfacebloat：接口方法数上限，超过即拆分为更小的角色接口。
    interfacebloat:
      max: 10
    # funlen：函数行数/语句数上限。线性装配与配置默认值同样受约束，
    # 超过即按职责拆分（避免「看起来简单但一路写到底」的上帝函数）。
    funlen:
      lines: 60
      statements: 40
    # 以下为补充的「结构/异味」护栏（当前均 0 命中，作为回归拦截）：
    #   containedctx 禁止把 context.Context 收进结构体（应显式传参）；
    #   decorder     约束声明顺序（const/var/type/func）；
    #   forbidigo    禁止库内散落的 fmt.Print* 调试输出（cmd/* CLI 输出另行豁免）；
    #   grouper      约束同类声明聚组；
    #   maintidx     可维护性指数下限（与 cyclop/gocognit 同口径）；
    #   musttag      序列化为 JSON 的结构体须带 tag；
    #   nakedret     禁止长函数使用裸 return；
    #   nilnesserr   避免 nil 检查后返回语义不一致的 error。
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: use-any
        - name: early-return
        - name: use-errors-new
        - name: string-of-int
        - name: modifies-value-receiver
        - name: import-shadowing
        - name: unnecessary-stmt
        - name: max-control-nesting
        - name: datarace
        - name: deep-exit
    staticcheck:
      checks:
        - all
    usetesting:
      context-background: true
      context-todo: true
    # varnamelen：短名只在声明附近可读；跨行长作用域必须用完整语义名。
    # 下列为 Go 社区惯用短名（循环下标、ctx/err、io 读写器、测试 t 等），不强制改写。
    varnamelen:
      ignore-names: [i, j, k, x, y, z, id, ok, err, ctx, db, tx, wg, mu, r, w, n, m, t, rc, fn, ip, mt, at, to, do]
    # wrapcheck：跨包返回的 error 必须用 %w 附加上下文。实现 io/net/http
    # 接口的包装方法必须原样透传底层 n 与 err——包装 io.EOF 会破坏 io.Copy 的等值
    # 判断，包装 net.Error 会丢失 Timeout()，故仅对这些接口实现按签名豁免。
    wrapcheck:
      ignore-interface-regexps:
        - ^(io\.(Reader|ReadCloser|Closer|ReaderFrom)|net\.Conn|http\.(ResponseWriter|Hijacker|Pusher)|context\.Context)$
      ignore-sig-regexps:
        - ^func \((net/http\.(ResponseWriter|Hijacker|Pusher)|io\.(ReaderFrom|Closer)|context\.Context|net\.Conn)\)\.
    # exhaustruct_v5：显式模式只对「全字段都应显式给出」的 DTO 生效；
    # 配置/状态结构含大量可选零值字段，逐个补零只会制造噪音，故不纳入。
    exhaustruct_v5:
      explicit-mode: true
      # 成功路径用零值表示「无此对象」（如上游无可用专家），与 err 无关。
      allow-empty-returns: true
      enforce-patterns:
        - '.*/internal/apikey\.Limits$'
        - '.*/internal/httpauth\.AuthResult$'
        - '.*/internal/usage\.Window$'
        - '.*/internal/notify\.Event$'
        - '.*/internal/quota\.Event$'
        - '.*/internal/reqlog\.ArchiveStats$'
        - '.*/internal/scheduler\.runSlot$'
        - '.*/internal/upstream\.MarketExpert$'
        - '.*/internal/panel\.loginToken$'
        - '.*/internal/usage\.BackfillRow$'
        - '.*/internal/pool\.RateLimitedModel$'
        - '.*/internal/agentcfg\.Status$'
        - '.*/internal/desktopcred\.Account$'
        - '.*/internal/panel\.queueItem$'
        - '.*/internal/panel\.row$'
        - '.*/internal/pricing\.Snapshot$'
        - '.*/internal/usage\.KeyedAgg$'
        - '.*/internal/upstream\.CreditPackage$'
        - '.*/internal/upstream\.ModelCapEntry$'
        - '.*/internal/upstream\.RequestUsagePage$'
        - '.*/internal/reqlog\.DecisionTrace$'
        - '.*/cmd/credit\.accountResult$'
    # wrapcheck：跨包返回的 error 必须用 %w 附加上下文。

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
          # 表驱动测试把用例平铺在一起最易读，按行数硬拆只会割裂断言上下文。
          - funlen
          - gosec
          - unparam
          - gocritic
          - prealloc
          - errchkjson
          # 测试惯用：httptest.NewRequest / exec.Command 不带 context；
          # UA 三段式等常量含合法重复词；表驱动 helper 命名自由。
          - noctx
          - dupword
          - nolintlint
          - dogsled
          - unused
          - errname
          - mirror
          - thelper
          - staticcheck
          - revive
          - predeclared
          - usetesting
          # 测试 helper 常把 ctx 收进结构体模拟真实 reader/客户端，非生产代码的 ctx 反模式。
          - containedctx
          # 测试内的长 JSON / SSE 字面量无法合理折行，豁免行宽检查。
          - lll
      # CLI 工具（cmd/*）向终端打印是其正常输出，非库内调试残留。
      - path: ^cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/BegoniaHe/wokbuddy-demon)
      custom-order: true
