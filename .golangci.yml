version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - dupword
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocognit
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
    govet:
      # enable-all 包含 shadow（变量遮蔽）与 nilness 等 Go 官方分析器。
      enable-all: true
      disable:
        - fieldalignment
    # depguard：拦截已废弃或应使用标准库替代的依赖，防止回退。
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: 已废弃，改用 io / os
            - pkg: math/rand$
              desc: 使用 math/rand/v2
            - pkg: golang.org/x/exp
              desc: 使用标准库
    gocritic:
      enable-all: true
      disabled-checks:
        # 项目既有 API 一致返回多值、匿名返回；重命名会波及大量调用点，
        # 属风格取舍而非缺陷。
        - tooManyResultsChecker
        - unnamedResult
    gosec:
      excludes: []
    misspell:
      locale: US
    # mnd：只约束 return 与 case 中的魔数（其他位置多为协议/尺寸常量，噪音过大）。
    mnd:
      checks:
        - return
        - case
        - operation
        - condition
      ignored-numbers: ['2','3','4','5','6','7','8','9','10','16','24','32','60','100','1000','3600','86400','1024','4096']
      ignored-files: ['_test\.go$']
    exhaustive:
      # 带 default 兜底的 switch 视为已穷举（项目大量 switch 用 default 收口）。
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    # godot：仅要求声明注释以句号收尾（接受中文句号「。」），不约束行内注释。
    godot:
      scope: declarations
    # godoclint：只保留跨文件通用的两项（弃用标记格式、文档链接有效性），
    # 不强制本仓库「每文件首行注释即包文档」的既有写法。
    godoclint:
      default: none
      enable:
        - deprecated
        - no-unused-link
    # goconst：仅拦截长字符串的高频重复（短 JSON key 另由人工判断）。
    goconst:
      min-len: 10
      min-occurrences: 5
      ignore-tests: true
    # lll：源码行宽上限 112（测试内的长 JSON 字面量另行豁免，见 exclusions）。
    lll:
      line-length: 112
    # dupl：50 token 的重复片段视为可提取（路由表等线性结构另行标注）。
    dupl:
      threshold: 50
    # cyclop / gocognit / nestif：函数复杂度上限。三者同口径收紧，
    # 用于抑制超长热路径（如 SSE 聚合、请求转发）继续膨胀。
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 14
    # gocyclo 与 cyclop 口径不同，作为第二重复杂度护栏。
    gocyclo:
      min-complexity: 10
    nestif:
      min-complexity: 4
    # interfacebloat：接口方法数上限，超过即拆分为更小的角色接口。
    interfacebloat:
      max: 5
    # ireturn：返回接口是 redisstore 抽象与聊天输入多态的设计选择，仅放行这两类。
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - '.*redisstore\.Store$'
        - '.*server\.chatResponder$'
    # funlen：函数行数/语句数上限。线性装配与配置默认值同样受约束，
    # 超过即按职责拆分（避免「看起来简单但一路写到底」的上帝函数）。
    funlen:
      lines: 48
      statements: 37
    # 以下为补充的「结构/异味」护栏（当前均 0 命中，作为回归拦截）：
    #   containedctx 禁止把 context.Context 收进结构体（应显式传参）；
    #   decorder     约束声明顺序（const/var/type/func）；
    #   forbidigo    禁止库内散落的 fmt.Print* 调试输出（cmd/* CLI 输出另行豁免）；
    #   grouper      约束同类声明聚组；
    #   maintidx     可维护性指数下限 38（与 cyclop/gocognit 同口径）；
    #   musttag      序列化为 JSON 的结构体须带 tag；
    #   nakedret     禁止长函数使用裸 return；
    #   nilnesserr   避免 nil 检查后返回语义不一致的 error。
    maintidx:
      under: 38
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: use-any
        - name: early-return
        - name: use-errors-new
        - name: string-of-int
        - name: modifies-value-receiver
        - name: import-shadowing
        - name: unnecessary-stmt
        - name: max-control-nesting
        - name: time-equal
        - name: comment-spacings
        - name: atomic
        - name: optimize-operands-order
        - name: string-format
        - name: waitgroup-by-value
        - name: unconditional-recursion
        - name: banned-characters
        - name: enforce-map-style
        - name: enforce-slice-style
        - name: use-slices-sort
        - name: bare-return
        - name: modifies-parameter
        - name: range-val-in-closure
        - name: range-val-address
        - name: struct-tag
        - name: unused-receiver
        - name: function-result-limit
          arguments: [5]
        - name: argument-limit
          arguments: [8]
        - name: max-public-structs
          arguments: [9]
        - name: confusing-naming
        - name: datarace
        - name: deep-exit
    staticcheck:
      checks:
        - all
    usetesting:
      context-background: true
      context-todo: true
    # varnamelen：短名只在声明附近可读；跨行长作用域必须用完整语义名。
    # 下列为 Go 社区惯用短名（循环下标、ctx/err、io 读写器、测试 t 等），不强制改写。
    varnamelen:
      ignore-names: [i, j, k, x, y, z, id, ok, err, ctx, db, tx, wg, mu, r, w, n, m, t, rc, fn, ip, mt, at, to, do]
    # wrapcheck：跨包返回的 error 必须用 %w 附加上下文。实现 io/net/http
    # 接口的包装方法必须原样透传底层 n 与 err——包装 io.EOF 会破坏 io.Copy 的等值
    # 判断，包装 net.Error 会丢失 Timeout()，故仅对这些接口实现按签名豁免。
    wrapcheck:
      ignore-interface-regexps:
        - ^(io\.(Reader|ReadCloser|Closer|ReaderFrom)|net\.Conn|http\.(ResponseWriter|Hijacker|Pusher)|context\.Context)$
      ignore-sig-regexps:
        - ^func \((net/http\.(ResponseWriter|Hijacker|Pusher)|io\.(ReaderFrom|Closer)|context\.Context|net\.Conn)\)\.
    # exhaustruct_v5：显式模式只对「全字段都应显式给出」的 DTO 生效；
    # 配置/状态结构含大量可选零值字段，逐个补零只会制造噪音，故不纳入。
    exhaustruct_v5:
      explicit-mode: true
      # 成功路径用零值表示「无此对象」（如上游无可用专家），与 err 无关。
      allow-empty-returns: true
      enforce-patterns:
        - '.*/internal/apikey\.Limits$'
        - '.*/internal/httpauth\.AuthResult$'
        - '.*/internal/usage\.Window$'
        - '.*/internal/notify\.Event$'
        - '.*/internal/quota\.Event$'
        - '.*/internal/reqlog\.ArchiveStats$'
        - '.*/internal/scheduler\.runSlot$'
        - '.*/internal/upstream\.MarketExpert$'
        - '.*/internal/panel\.loginToken$'
        - '.*/internal/usage\.BackfillRow$'
        - '.*/internal/pool\.RateLimitedModel$'
        - '.*/internal/agentcfg\.Status$'
        - '.*/internal/desktopcred\.Account$'
        - '.*/internal/panel\.queueItem$'
        - '.*/internal/panel\.row$'
        - '.*/internal/pricing\.Snapshot$'
        - '.*/internal/usage\.KeyedAgg$'
        - '.*/internal/upstream\.CreditPackage$'
        - '.*/internal/upstream\.ModelCapEntry$'
        - '.*/internal/upstream\.RequestUsagePage$'
        - '.*/internal/reqlog\.DecisionTrace$'
        - '.*/cmd/credit\.accountResult$'
    # wrapcheck：跨包返回的 error 必须用 %w 附加上下文。

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forcetypeassert
          # 表驱动测试把用例平铺在一起最易读，按行数硬拆只会割裂断言上下文。
          - funlen
          - gocyclo
          - gocognit
          - dupl
          - maintidx
          - nestif
          - gosec
          - unparam
          - gocritic
          - prealloc
          - errchkjson
          # 测试惯用：httptest.NewRequest / exec.Command 不带 context；
          # UA 三段式等常量含合法重复词；表驱动 helper 命名自由。
          - noctx
          - dupword
          - nolintlint
          - dogsled
          - unused
          - errname
          - mirror
          - thelper
          - staticcheck
          - revive
          - predeclared
          - usetesting
          # 测试 helper 常把 ctx 收进结构体模拟真实 reader/客户端，非生产代码的 ctx 反模式。
          - containedctx
          # 测试内的长 JSON / SSE 字面量无法合理折行，豁免行宽检查。
          - lll
      # CLI 工具（cmd/*）向终端打印是其正常输出，非库内调试残留。
      - path: ^cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/BegoniaHe/wokbuddy-demon)
      custom-order: true
